# Fork-only multi-platform release for kuwa2005/herdr.
# Upstream release.yml stays gated to herdrdev/herdr.
#
# Usage:
#   1. Bump Cargo.toml version, commit, push master
#   2. Tag and push: git tag v0.9.3 && git push origin v0.9.3
#      OR Actions → Fork Release → Run workflow (version = 0.9.3)
#
# Builds linux/macos/windows assets, publishes the GitHub Release, and
# updates distribution/latest.json on master so install.sh / herdr update
# point at this repository's assets for every platform.

name: Fork Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.9.2). Empty = Cargo.toml version."
        required: false
        default: ""
      ref:
        description: "Git ref to build (branch/tag/SHA). Empty = this workflow ref."
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  FORK_OWNER: kuwa2005
  FORK_REPO: herdr

jobs:
  guard:
    if: github.repository == 'kuwa2005/herdr'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$CARGO_VERSION"
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "error: requested version $VERSION does not match Cargo.toml $CARGO_VERSION"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            CHECKOUT_REF="${{ inputs.ref }}"
          else
            CHECKOUT_REF="${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (tag v$VERSION) from $CHECKOUT_REF"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
            platform_key: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
            platform_key: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
            platform_key: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
            platform_key: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-windows-x86_64.zip
            platform_key: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.guard.outputs.checkout_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.name }}"
          python3 -c '
          import hashlib, pathlib
          p = pathlib.Path("${{ matrix.name }}")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("SHA256").write_text(f"{digest}  {p.name}\n")
          print(digest)
          '

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}
          python -c "import hashlib, pathlib; p=pathlib.Path(r'${{ matrix.name }}'); d=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('SHA256').write_text(f'{d}  {p.name}\n'); print(d)"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            SHA256

  publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need write credentials to push latest.json update
          persist-credentials: true
          ref: master
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for name in \
            herdr-linux-x86_64 \
            herdr-linux-aarch64 \
            herdr-macos-x86_64 \
            herdr-macos-aarch64 \
            herdr-windows-x86_64.zip
          do
            if [ -f "$name/$name" ]; then
              cp "$name/$name" "dist/$name"
              cp "$name/SHA256" "dist/$name.sha256"
            else
              echo "missing artifact layout for $name" >&2
              find . -maxdepth 3 -type f | sort | head -200 >&2
              exit 1
            fi
          done
          ls -la dist

      - name: Ensure tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
          CHECKOUT_REF: ${{ needs.guard.outputs.checkout_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$CHECKOUT_REF"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          ### kuwa2005/herdr fork (${VERSION})
          - Multi-platform binaries built by Fork Release workflow.
          - Japanese UI/CLI via \`[ui].language = "ja"\` (and \`en\` / \`zh-cn\`).
          - Oimo agent screen detection included when present in this tree.

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/kuwa2005/herdr/master/distribution/install.sh | sh
          \`\`\`
          EOF
          # Strip accidental leading indentation from the heredoc body.
          sed -i 's/^          //' "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --latest \
              --notes-file "$NOTES"
          fi

      - name: Update distribution/latest.json
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fork_update_latest_json.py \
            --version "$VERSION" \
            --dist-dir dist \
            --repo kuwa2005/herdr \
            --manifest distribution/latest.json

      - name: Commit and push latest.json
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- distribution/latest.json; then
            echo "latest.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          git add distribution/latest.json
          git commit -m "release: point latest.json at v${VERSION} multi-os assets"
          git push origin HEAD:master
